# Sends synthetic traces to the Collector. SERVICE_NAME is substituted by scripts/smoke-trace.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen
  namespace: observability
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.114.0
          args:
            - traces
            - --otlp-endpoint=otel-collector.observability:4317
            - --otlp-insecure
            - --traces=3
            - --service=SERVICE_NAME
